[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grounding"
version = "0.1.0"
description = "Symbolic 3D visual grounding on Nr3D: LLM parser, scene representation, resolver"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Install the extras for the workflow you need.
dependencies = []

[project.optional-dependencies]
evaluation = [
    "huggingface-hub==0.25.2",
    "numpy==1.26.4",
    "openai==1.60.0",
    "opencv-python==4.10.0.84",
    "pandas==2.2.3",
    "Pillow",
    "scikit-image==0.24.0",
    "torch",
    "torchvision",
    "tqdm",
    "transformers==4.17.0",
]
# Parser generation and LoRA training (PyTorch + Hugging Face). Install torch
# for your CUDA version first if pip's default wheel does not match your driver:
# https://pytorch.org/get-started/locally/
training = [
    "torch>=2.4",
    "transformers>=4.51",   # Qwen3 support
    "peft>=0.13",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "numpy",
    "PyYAML==6.0.3",
    "openai>=1.40",         # optional GPT-4o teacher backend
    "wandb==0.27.0",
]
# 4-/8-bit weight quantisation for large teachers (Linux + NVIDIA GPU)
quantization = [
    "bitsandbytes>=0.45",
]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
"grounding._vendor.lasp" = ["LICENSE"]
